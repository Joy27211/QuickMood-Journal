<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuickMood Journal</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e14;
      --card: #16161f;
      --border: #2a2a3a;
      --text: #e8e8f0;
      --muted: #7a7a9a;
      --accent: #f0c060;
      --radius: 16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 24px 16px 60px;
      background-image: radial-gradient(ellipse at 20% 20%, #1a1a2e 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 80%, #12121e 0%, transparent 60%);
    }

    header {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeDown 0.7s ease both;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3rem);
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    /* --- Log Card --- */
    .log-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 28px;
      animation: fadeUp 0.6s ease both 0.1s;
    }

    .log-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      margin-bottom: 18px;
      color: var(--text);
    }

    /* Mood picker */
    .mood-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 20px;
    }

    .mood-btn {
      flex: 1;
      background: #1e1e2c;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 12px 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .mood-btn:hover { border-color: var(--border); transform: translateY(-2px); }
    .mood-btn.selected { border-color: var(--accent); background: #2a2510; }
    .mood-btn span.emoji { font-size: 1.8rem; }
    .mood-btn span.label { font-size: 0.65rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .mood-btn.selected span.label { color: var(--accent); }

    /* Textarea */
    textarea {
      width: 100%;
      background: #1e1e2c;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      padding: 14px;
      resize: none;
      height: 100px;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea::placeholder { color: var(--muted); }
    textarea:focus { border-color: var(--accent); }

    /* Save button */
    .save-btn {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .save-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .save-btn:active { transform: translateY(0); }

    /* Quote box */
    .quote-box {
      background: #1a1a08;
      border: 1px solid #3a3010;
      border-radius: 10px;
      padding: 14px 18px;
      margin-top: 16px;
      font-size: 0.88rem;
      color: #c8a840;
      font-style: italic;
      display: none;
      animation: fadeUp 0.4s ease;
    }

    /* --- History --- */
    .history-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      animation: fadeUp 0.6s ease both 0.2s;
    }

    .history-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      margin-bottom: 18px;
      color: var(--text);
    }

    .entry-list { display: flex; flex-direction: column; gap: 10px; }

    .entry-item {
      background: #1e1e2c;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      animation: fadeUp 0.3s ease;
    }

    .entry-emoji { font-size: 1.6rem; flex-shrink: 0; margin-top: 2px; }

    .entry-body { flex: 1; }
    .entry-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .entry-mood { font-size: 0.75rem; font-weight: 500; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
    .entry-date { font-size: 0.72rem; color: var(--muted); }
    .entry-note { font-size: 0.88rem; color: #b0b0c8; line-height: 1.5; }

    .empty-state {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 20px 0;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .delete-btn:hover { color: #e06060; background: #2a1010; }

    /* streak */
    .streak-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a1a08;
      border: 1px solid #3a3010;
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 18px;
      font-size: 0.85rem;
      color: #c8a840;
    }
    .streak-bar span.fire { font-size: 1.2rem; }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--accent);
      color: #111;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: transform 0.35s cubic-bezier(.22,1,.36,1);
      z-index: 999;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>QuickMood 🌙</h1>
    <p>Your tiny daily journal — how are you feeling today?</p>
  </header>

  <!-- Log Section -->
  <div class="log-card">
    <h2>Log Today's Mood</h2>
    <div class="mood-row" id="moodRow">
      <button class="mood-btn" data-mood="Amazing" onclick="selectMood(this)">
        <span class="emoji">🤩</span><span class="label">Amazing</span>
      </button>
      <button class="mood-btn" data-mood="Happy" onclick="selectMood(this)">
        <span class="emoji">😊</span><span class="label">Happy</span>
      </button>
      <button class="mood-btn" data-mood="Neutral" onclick="selectMood(this)">
        <span class="emoji">😐</span><span class="label">Neutral</span>
      </button>
      <button class="mood-btn" data-mood="Sad" onclick="selectMood(this)">
        <span class="emoji">😢</span><span class="label">Sad</span>
      </button>
      <button class="mood-btn" data-mood="Awful" onclick="selectMood(this)">
        <span class="emoji">😤</span><span class="label">Awful</span>
      </button>
    </div>
    <textarea id="noteInput" placeholder="Write a little about your day... (optional)"></textarea>
    <button class="save-btn" onclick="saveEntry()">Save Entry ✨</button>
    <div class="quote-box" id="quoteBox"></div>
  </div>

  <!-- History Section -->
  <div class="history-card">
    <h2>Your Journal 📖</h2>
    <div class="streak-bar" id="streakBar" style="display:none">
      <span class="fire">🔥</span>
      <span id="streakText"></span>
    </div>
    <div class="entry-list" id="entryList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const QUOTES = {
    Amazing: [
      "Ride this wave — joy is your natural state.",
      "You're glowing. Keep that energy alive.",
      "Amazing days are proof of what's possible."
    ],
    Happy: [
      "Happiness is a practice. You're nailing it.",
      "Small joys add up to a beautiful life.",
      "Keep doing whatever you did today."
    ],
    Neutral: [
      "Not every day needs to be extraordinary.",
      "Steady is its own kind of strength.",
      "Neutral days are the quiet canvas of life."
    ],
    Sad: [
      "It's okay to feel this. You're not alone.",
      "Every storm runs out of rain.",
      "Feeling sad means you care deeply — that's beautiful."
    ],
    Awful: [
      "This too shall pass. Truly.",
      "Rough days make you appreciate the good ones.",
      "Be gentle with yourself today."
    ]
  };

  const EMOJIS = { Amazing: "🤩", Happy: "😊", Neutral: "😐", Sad: "😢", Awful: "😤" };

  let selectedMood = null;

  function selectMood(btn) {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMood = btn.dataset.mood;
  }

  function saveEntry() {
    if (!selectedMood) { showToast("Pick a mood first! 😊"); return; }
    const note = document.getElementById('noteInput').value.trim();
    const entries = getEntries();
    const entry = {
      id: Date.now(),
      mood: selectedMood,
      emoji: EMOJIS[selectedMood],
      note: note,
      date: new Date().toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })
    };
    entries.unshift(entry);
    localStorage.setItem('quickmood_entries', JSON.stringify(entries));

    // Show quote
    const quotes = QUOTES[selectedMood];
    const q = quotes[Math.floor(Math.random() * quotes.length)];
    const qBox = document.getElementById('quoteBox');
    qBox.textContent = `"${q}"`;
    qBox.style.display = 'block';

    // Reset
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('noteInput').value = '';
    selectedMood = null;

    renderEntries();
    showToast("Entry saved! 🌙");
  }

  function getEntries() {
    try { return JSON.parse(localStorage.getItem('quickmood_entries')) || []; }
    catch { return []; }
  }

  function deleteEntry(id) {
    const entries = getEntries().filter(e => e.id !== id);
    localStorage.setItem('quickmood_entries', JSON.stringify(entries));
    renderEntries();
    showToast("Entry deleted.");
  }

  function calcStreak(entries) {
    if (!entries.length) return 0;
    // simple streak: count consecutive days from today
    const today = new Date(); today.setHours(0,0,0,0);
    const days = new Set(entries.map(e => {
      const d = new Date(e.id); d.setHours(0,0,0,0); return d.getTime();
    }));
    let streak = 0, check = new Date(today);
    while (days.has(check.getTime())) {
      streak++;
      check.setDate(check.getDate() - 1);
    }
    return streak;
  }

  function renderEntries() {
    const entries = getEntries();
    const list = document.getElementById('entryList');
    const streakBar = document.getElementById('streakBar');
    const streakText = document.getElementById('streakText');

    const streak = calcStreak(entries);
    if (streak > 0) {
      streakBar.style.display = 'flex';
      streakText.textContent = streak === 1 ? "1 day streak — keep going!" : `${streak} day streak — you're on fire!`;
    } else {
      streakBar.style.display = 'none';
    }

    if (!entries.length) {
      list.innerHTML = '<div class="empty-state">No entries yet. Log your first mood above! ✨</div>';
      return;
    }

    list.innerHTML = entries.map(e => `
      <div class="entry-item">
        <div class="entry-emoji">${e.emoji}</div>
        <div class="entry-body">
          <div class="entry-meta">
            <span class="entry-mood">${e.mood}</span>
            <span class="entry-date">${e.date}</span>
          </div>
          ${e.note ? `<div class="entry-note">${escHtml(e.note)}</div>` : '<div class="entry-note" style="color:#555">No note written.</div>'}
        </div>
        <button class="delete-btn" onclick="deleteEntry(${e.id})" title="Delete">✕</button>
      </div>
    `).join('');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // Init
  renderEntries();
</script>
</body>
</html>
